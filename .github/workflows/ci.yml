name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci --ignore-scripts --include=optional
      - run: npm run check
      - name: Verify production Node runtime and CA bundle
        run: node --test test/node-runtime.test.mjs
      # Bun is used only for the offline test server and test runner.
      # Installation and production network access use patched Node.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Offline unit and loopback transport tests
        env:
          HOME: ${{ runner.temp }}/test-home
        run: |
          mkdir -p "$HOME"
          node scripts/test-unit.mjs
      - name: Verify guarded production dependency installation
        run: sh src/run-node.sh src/install.mjs
